name: CI and Modrinth Release

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  wrapper-validation:
    name: Wrapper validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

  build:
    name: Build and verify
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and validate release artifact
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean check --stacktrace --console=plain

      - name: Record artifact checksum
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar')
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one release JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          jar_dir=$(dirname "${jars[0]}")
          jar_name=$(basename "${jars[0]}")
          (cd "$jar_dir" && sha256sum "$jar_name" > "$jar_name.sha256")

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: |
            build/libs/*.jar
            build/libs/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  server-smoke:
    name: Dedicated server smoke test
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Launch dedicated server through mod initialization
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          mkdir -p build/ci
          timeout 5m ./gradlew runServer --args nogui --stacktrace --console=plain | tee build/ci/server-smoke.log
          grep -F "You need to agree to the EULA" build/ci/server-smoke.log

      - name: Upload server smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-${{ github.run_id }}
          path: build/ci/server-smoke.log
          if-no-files-found: ignore
          retention-days: 14

  farmers-delight-versions:
    name: Discover Farmer's Delight versions
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select the latest compatible releases
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          minecraft_version=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          dependency_range=$(sed -n 's/^farmers_delight_refabricated_range=//p' gradle.properties)
          if [[ "$dependency_range" != ">="* ]]; then
            echo "Unsupported Farmer's Delight version range: $dependency_range" >&2
            exit 1
          fi
          minimum_version=${dependency_range#>=}

          response=$(curl --fail-with-body --silent --show-error --retry 3 --get \
            --header 'User-Agent: BrewinAndChewin-Fly-CI/1.0 (https://github.com/bobqianic/BrewinAndChewin-Fly)' \
            --data-urlencode 'loaders=["fabric"]' \
            --data-urlencode "game_versions=[\"${minecraft_version}\"]" \
            'https://api.modrinth.com/v2/project/farmers-delight-refabricated/version')

          selected=()
          while IFS=$'\t' read -r version_id version_number; do
            oldest=$(printf '%s\n' "$minimum_version" "$version_number" | sort --version-sort | head -n 1)
            if [[ "$oldest" == "$minimum_version" ]]; then
              selected+=("${version_id}"$'\t'"${version_number}")
            fi
            if [[ ${#selected[@]} -eq 5 ]]; then
              break
            fi
          done < <(jq -r '
            sort_by(.date_published) | reverse | .[]
            | select(.version_type == "release")
            | [.id, .version_number]
            | @tsv
          ' <<< "$response")

          if [[ ${#selected[@]} -eq 0 ]]; then
            echo "Modrinth returned no compatible Fabric releases for Minecraft $minecraft_version" >&2
            exit 1
          fi

          versions=$(printf '%s\n' "${selected[@]}" | jq -Rsc '
            split("\n")[:-1]
            | map(split("\t") | {id: .[0], number: .[1]})
          ')
          echo "Selected Farmer's Delight releases: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  farmers-delight-compatibility:
    name: Farmer's Delight ${{ matrix.farmers_delight.number }} compatibility
    needs:
      - wrapper-validation
      - farmers-delight-versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        farmers_delight: ${{ fromJSON(needs.farmers-delight-versions.outputs.versions) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Launch server and client
        shell: bash
        env:
          FARMERS_DELIGHT_ID: ${{ matrix.farmers_delight.id }}
          FARMERS_DELIGHT_VERSION: ${{ matrix.farmers_delight.number }}
          ALSOFT_DRIVERS: "null"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p build/ci run
          echo 'eula=true' > run/eula.txt

          active_pid=''
          stop_process_group() {
            if [[ -n "$active_pid" ]] && kill -0 "$active_pid" 2>/dev/null; then
              kill -TERM -- "-$active_pid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$active_pid" 2>/dev/null || true
              wait "$active_pid" 2>/dev/null || true
            fi
            active_pid=''
          }
          trap stop_process_group EXIT

          smoke_launch() {
            local name=$1
            local marker=$2
            shift 2
            local log="build/ci/${name}.log"

            setsid "$@" > "$log" 2>&1 &
            active_pid=$!
            for _ in {1..150}; do
              if grep -Fq "$marker" "$log"; then
                if ! grep -Fq "farmersdelight ${FARMERS_DELIGHT_VERSION}" "$log"; then
                  echo "$name loaded an unexpected Farmer's Delight version" >&2
                  cat "$log"
                  return 1
                fi
                stop_process_group
                cat "$log"
                return 0
              fi
              if ! kill -0 "$active_pid" 2>/dev/null; then
                wait "$active_pid" || true
                active_pid=''
                echo "$name exited before reaching readiness marker: $marker" >&2
                cat "$log"
                return 1
              fi
              sleep 2
            done

            echo "$name did not reach readiness marker within 5 minutes: $marker" >&2
            stop_process_group
            cat "$log"
            return 1
          }

          dependency="-Pfarmers_delight_refabricated_version=${FARMERS_DELIGHT_ID}"
          smoke_launch server 'Done (' \
            ./gradlew "$dependency" runServer --args nogui --stacktrace --console=plain
          smoke_launch client 'Sound engine started' \
            xvfb-run -a ./gradlew "$dependency" runClient --stacktrace --console=plain

      - name: Upload compatibility logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmers-delight-${{ matrix.farmers_delight.number }}-${{ github.run_id }}
          path: |
            build/ci/*.log
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
          retention-days: 14

  farmers-delight-compatibility-gate:
    name: Farmer's Delight compatibility
    needs: farmers-delight-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm compatibility matrix passed
        run: echo "All Farmer's Delight compatibility checks passed."

  publish-modrinth:
    name: Publish verified JAR to Modrinth
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - build
      - server-smoke
      - farmers-delight-compatibility-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: modrinth-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: release

      - name: Validate release tag and checksum
        shell: bash
        run: |
          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          minecraft_version=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          expected_tag="v${mod_version}+${minecraft_version}-fabric"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag must be $expected_tag, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          (cd release && sha256sum -c ./*.sha256)

      - name: Publish the verified JAR
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          chmod +x gradlew
          mapfile -t jars < <(find release -maxdepth 1 -type f -name '*.jar')
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one verified release JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          ./gradlew check publishMods -PreleaseArtifact="${jars[0]}" --stacktrace --console=plain
