plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java-library'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_plugin_version}"
}

version = "${mod_version}+${minecraft_version}"
group = maven_group

base {
    archivesName = archives_base_name
}

repositories {
    mavenCentral()

    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        url = 'https://maven.nucleoid.xyz'
    }

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = 'https://jitpack.io'
            }
        }
        filter {
            includeGroup 'com.github.Chocohead'
        }
    }
}

loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath = aw
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            name = 'Fabric Client'
            ideConfigGenerated = true
            vmArgs '-Dmixin.debug.verbose=true', '-Dmixin.debug.export=true'
        }
        server {
            server()
            name = 'Fabric Server'
            ideConfigGenerated = true
            vmArgs '-Dmixin.debug.verbose=true', '-Dmixin.debug.export=true'
        }
    }
}

sourceSets {
    main {
        java {
            exclude 'umpaz/brewinandchewin/integration/emi/**'
            exclude 'umpaz/brewinandchewin/common/mixin/client/ModelBakeryAccessor.java'
        }
        resources {
            srcDir 'src/generated/resources'
            exclude '**/.cache/**', '**/.cache'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    runtimeOnly "maven.modrinth:modmenu:${mod_menu_version}"

    compileOnly "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    compileOnly "net.fabricmc:sponge-mixin:${fabric_mixin_version}"
    implementation 'org.jetbrains:annotations:24.1.0'

    implementation("maven.modrinth:farmers-delight-refabricated:${farmers_delight_refabricated_version}") {
        exclude group: 'net.fabricmc'
    }

    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    compileOnly "maven.modrinth:appleskin:${appleskin_fabric_version_id}"
    runtimeOnly "maven.modrinth:appleskin:${appleskin_fabric_version_id}"
    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    runtimeOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }

    implementation("com.github.Chocohead:Fabric-ASM:${fabric_asm_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    include("com.github.Chocohead:Fabric-ASM:${fabric_asm_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }

    compileOnly "maven.modrinth:create-fly:${create_fly_version}"
    runtimeOnly "maven.modrinth:create-fly:${create_fly_version}"

    compileOnly "maven.modrinth:styled-chat:${styled_chat_version}"
    compileOnly "eu.pb4:placeholder-api:${pb4_placeholder_api_version}"

    runtimeOnly "maven.modrinth:styled-chat:${styled_chat_version}"
    runtimeOnly "eu.pb4:predicate-api:${pb4_predicate_api_version}"
    runtimeOnly "eu.pb4:placeholder-api:${pb4_placeholder_api_version}"
    runtimeOnly "me.lucko:fabric-permissions-api:${permissions_api_version}"
    runtimeOnly "eu.pb4:player-data-api:${pb4_player_data_api_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
    withSourcesJar()
}

def resourceProperties = [
        mod_version                         : mod_version,
        group                               : project.group,
        minecraft_version                   : minecraft_version,
        fabric_api_version                  : fabric_version,
        fabric_loader_version               : loader_version,
        fabric_minecraft_version_range      : fabric_minecraft_version_range,
        fabric_loader_range                 : fabric_loader_range,
        mod_name                            : mod_name,
        fabric_mod_authors                  : mod_authors.split(',').collect { it.trim() }.join('",\n    "'),
        mod_id                              : mod_id,
        mod_license                         : mod_license,
        mod_description                     : mod_description,
        java_version                        : java_version,
        modrinth_page                       : modrinth_page,
        create_fly_fabric_range             : create_fly_fabric_range,
        farmers_delight_refabricated_range  : farmers_delight_refabricated_range,
        HotCocoa                            : '$HotCocoa',
        MilkBottle                          : '$MilkBottle',
        LootParamsBuilderMixin              : '$LootParamsBuilderMixin',
        LootParamsMixin                     : '$LootParamsMixin',
        TipsyCanvasSignRenderMixin          : '$TipsyCanvasSignRenderMixin',
        TipsySignRenderMixin                : '$TipsySignRenderMixin'
]

tasks.withType(ProcessResources).configureEach {
    inputs.properties resourceProperties
    filesMatching(['fabric.mod.json', '*.mixins.json']) {
        expand resourceProperties
    }
    exclude "${mod_id}.cfg"
    exclude '**/.cache/**', '**/.cache'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
    from('LICENSE') {
        rename { "${it}_${mod_name}" }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : archiveVersion,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Built-On-Minecraft'      : minecraft_version
        ])
    }
}

def defaultReleaseJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def suppliedReleaseJar = providers.gradleProperty('releaseArtifact').map { layout.projectDirectory.file(it) }
def releaseJar = suppliedReleaseJar.orElse(defaultReleaseJar)

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Validates the metadata and referenced classes in the exact release JAR.'

    if (!suppliedReleaseJar.isPresent()) {
        dependsOn tasks.named('jar')
    }
    inputs.file(releaseJar)
    inputs.file(rootProject.file('CHANGELOG.md'))
    inputs.property('expectedModVersion', mod_version)

    doLast {
        File archive = releaseJar.get().asFile
        if (!archive.isFile()) {
            throw new GradleException("Release JAR does not exist: ${archive}")
        }

        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def requireEntry = { String name ->
                def entry = zip.getEntry(name)
                if (entry == null) {
                    throw new GradleException("Release JAR is missing ${name}")
                }
                entry
            }
            def readJson = { String name ->
                def entry = requireEntry(name)
                zip.getInputStream(entry).withCloseable { stream ->
                    new groovy.json.JsonSlurper().parseText(stream.getText('UTF-8'))
                }
            }
            def requireClass = { String owner, String className ->
                String resource = className.split('::', 2)[0].replace('.', '/') + '.class'
                if (zip.getEntry(resource) == null) {
                    throw new GradleException("${owner} references missing class ${className}")
                }
            }

            def metadata = readJson('fabric.mod.json')
            if (metadata.version != mod_version) {
                throw new GradleException("fabric.mod.json version ${metadata.version} does not match ${mod_version}")
            }

            String accessTransformer = (metadata.accessWidener ?: metadata.classTweaker)?.toString()
            if (accessTransformer == null) {
                throw new GradleException('fabric.mod.json does not declare an access widener or class tweaker')
            }
            requireEntry(accessTransformer)

            if (metadata.icon instanceof String) {
                requireEntry(metadata.icon)
            }

            (metadata.entrypoints ?: [:]).each { type, entrypoints ->
                entrypoints.each { entrypoint ->
                    String className = entrypoint instanceof Map ? entrypoint.value : entrypoint
                    requireClass("fabric.mod.json entrypoint ${type}", className)
                }
            }

            (metadata.mixins ?: []).each { declaredConfig ->
                String configName = declaredConfig instanceof Map ? declaredConfig.config : declaredConfig
                def mixinConfig = readJson(configName)
                String mixinPackage = mixinConfig['package'].toString()
                ['mixins', 'client', 'server'].each { section ->
                    (mixinConfig[section] ?: []).each { mixin ->
                        requireClass(configName, "${mixinPackage}.${mixin}")
                    }
                }
            }
        }

        String expectedHeading = "# ${mod_version}"
        String actualHeading = rootProject.file('CHANGELOG.md').readLines('UTF-8').first()
        if (actualHeading != expectedHeading) {
            throw new GradleException("CHANGELOG.md must start with '${expectedHeading}', found '${actualHeading}'")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('test')
    dependsOn tasks.named('validateAccessWidener')
    dependsOn tasks.named('verifyReleaseJar')
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = archives_base_name
            from components.java
        }
    }
}

publishMods {
    file = releaseJar
    modLoaders.add 'fabric'
    changelog = rootProject.file('CHANGELOG.md').text
    displayName = "v${mod_version} (Fabric ${minecraft_version})"
    version = "${mod_version}+${minecraft_version}-fabric"
    type = STABLE

    if (modrinth_project_id) {
        modrinth {
            projectId = modrinth_project_id
            accessToken = providers.environmentVariable('MODRINTH_TOKEN')
            minecraftVersions.add minecraft_version
            requires 'fabric-api'
            requires 'farmers-delight-refabricated'
            optional 'create-fly'
            optional 'jei'
            optional 'appleskin'
            optional 'styled-chat'
        }
    }
}

tasks.named('publishMods').configure {
    dependsOn tasks.named('check')
}

tasks.named('publishModrinth').configure {
    dependsOn tasks.named('check')
}

String expectedReleaseTag = "v${mod_version}+${minecraft_version}-fabric"
gradle.taskGraph.whenReady { graph ->
    boolean modrinthPublishRequested = graph.allTasks.any {
        it.project == project && it.name in ['publishMods', 'publishModrinth']
    }
    if (!modrinthPublishRequested) {
        return
    }

    if (System.getenv('GITHUB_ACTIONS') != 'true'
            || System.getenv('GITHUB_EVENT_NAME') != 'push'
            || System.getenv('GITHUB_REF_TYPE') != 'tag'
            || System.getenv('GITHUB_REF_NAME') != expectedReleaseTag) {
        throw new GradleException("Modrinth publishing is restricted to the GitHub Actions tag ${expectedReleaseTag}")
    }
    if (!suppliedReleaseJar.isPresent()) {
        throw new GradleException('Modrinth publishing requires -PreleaseArtifact with the verified CI artifact')
    }
}
